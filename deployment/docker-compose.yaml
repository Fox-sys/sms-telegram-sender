services:
  migrate:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: sms-telegram-sender:latest
    container_name: sms-telegram-migrate
    user: root
    env_file:
      - ../.env
    environment:
      - DB_URL=sqlite+aiosqlite:////data/sms.db
    volumes:
      - ./db-data:/data
    command: sh -c "mkdir -p /data && chown -R 999:999 /data && chmod -R 750 /data && env | grep -E '^(DB_|TELEGRAM_|API_|ALEMBIC_)' > /tmp/app.env && chown app /tmp/app.env && su -s /bin/sh app -c 'set -a && . /tmp/app.env 2>/dev/null; set +a && entrypoint_migrate.sh upgrade head'"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: sms-telegram-sender:latest
    container_name: sms-telegram-api
    user: root
    ports:
      - "8000:${API_PORT:-8080}"
    env_file:
      - ../.env
    environment:
      - DB_URL=sqlite+aiosqlite:////data/sms.db
    volumes:
      - ./db-data:/data
    command: sh -c "mkdir -p /data && chown -R 999:999 /data && chmod -R 750 /data && env | grep -E '^(DB_|TELEGRAM_|API_|ALEMBIC_)' > /tmp/app.env && chown app /tmp/app.env && su -s /bin/sh app -c 'set -a && . /tmp/app.env 2>/dev/null; set +a && entrypoint_api.sh'"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
