services:
  migrate:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: sms-telegram-sender:latest
    container_name: sms-telegram-migrate
    env_file:
      - ../.env
    environment:
      - DB_URL=sqlite+aiosqlite:////data/sms.db
    volumes:
      - ./db-data:/data
    command: ["entrypoint_migrate.sh", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: sms-telegram-sender:latest
    container_name: sms-telegram-api
    ports:
      - "8000:${API_PORT:-8080}"
    env_file:
      - ../.env
    environment:
      - DB_URL=sqlite+aiosqlite:////data/sms.db
    volumes:
      - ./db-data:/data
    command: ["entrypoint_api.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
