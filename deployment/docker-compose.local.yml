services:
  migrate:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: sms-telegram-sender:latest
    container_name: sms-telegram-migrate
    user: root
    env_file:
      - ../.env
    volumes:
      - ./db-data:/data
    command: sh -c "mkdir -p /data && chmod 750 /data && entrypoint_migrate.sh upgrade head && chown -R 999:999 /data"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: sms-telegram-sender:latest
    container_name: sms-telegram-api
    user: root
    ports:
      - "8000:${API_PORT:-8080}"
    env_file:
      - ../.env
    volumes:
      - ./db-data:/data
    command: sh -c "mkdir -p /data && chown -R 999:999 /data && chmod -R 750 /data && su -s /bin/sh app -c entrypoint_api.sh"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
